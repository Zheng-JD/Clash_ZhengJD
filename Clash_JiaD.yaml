proxy-groups:
  - name: 手动选择
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    include-all: true
    proxies:
      - 自动选择
      - DIRECT
    interval: 300
    tolerance: 50
  - name: 电报消息
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - DIRECT
  - name: Grok
    icon: https://raw.githubusercontent.com/Zheng-JD/Clash_ZhengJD/refs/heads/main/icon/grok.png
    type: select
    proxies:
      - 自动选择
      - 手动选择
  - name: OpenAi
    icon: https://raw.githubusercontent.com/luestr/IconResource/fc2dc45c8779cfba49e4c8ca9068ac16f5c728d7/App_icon/120px/ChatGPT.png
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - DIRECT
  - name: 国际代理
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ForeignMedia.png
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - DIRECT
  - name: Google
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Google_Search.png
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - DIRECT
  - name: 中国直连
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Direct.png
    type: select
    proxies:
      - DIRECT
      - 手动选择
      - 自动选择
  - name: 漏网之鱼
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Final.png
    type: select
    proxies:
      - 自动选择
      - 手动选择
      - DIRECT
  - name: 自动选择
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
    include-all: true
    type: url-test
    interval: 300
    tolerance: 50
  - name: GLOBAL
    icon: https://testingcf.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
    include-all: true
    type: select
    proxies:
      - 手动选择
      - 自动选择
      - 电报消息
      - Grok
      - OpenAi
      - 国际代理
      - Google
      - 中国直连
      - 漏网之鱼

